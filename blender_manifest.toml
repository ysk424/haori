schema_version = "1.0.0"

id = "haori"
version = "0.2.0"
name = "Haori"
tagline = "Fast animated cloth previews for Yohsai garments"
maintainer = "Haori Developers"
type = "add-on"

blender_version_min = "5.1.0"
platforms = ["windows-x64"]

license = ["SPDX:GPL-3.0-or-later"]

tags = ["Modeling", "Pipeline"]

[build]
paths = [
    "__init__.py",
    "CMakeLists.txt",
    "build_native.ps1",
    "build_native.sh",
    "ui.py",
    "simulation.py",
    "cosserat_native.py",
    "README.md",
    "CHANGELOG.md",
    "docs/ARCHITECTURE.md",
    "THIRD_PARTY_NOTICES.md",
    "LICENSE",
    "bin/haori_cosserat.dll",
    "bin/vcomp140.dll",
    "native/CMakeLists.txt",
    "native/include/haori_cosserat/c_api.h",
    "native/src/math.hpp",
    "native/src/solver.hpp",
    "native/src/solver.cpp",
    "native/src/c_api.cpp",
    "native/tests/test_solver.cpp",
]
